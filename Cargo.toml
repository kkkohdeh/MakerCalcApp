[package]
name = "makercalc"
version = "0.0.7"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"

[features]
ui-diagnostics = ["gpui-kit/profiler"]

[dependencies]
base64 = "=0.22.1"
gpui-kit = "=0.6.1"
raw-window-handle = "=0.6.2"
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "=1.0.28"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "native-tls"] }
tokio-native-tls = "0.3.1"
url = "2.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["multipart", "native-tls", "stream"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
rust-i18n = "=4.2.2"
rfd = { version = "=0.17.2", default-features = false }
tokio-util = { version = "=0.7.18", features = ["io"] }
bytes = "=1.11.1"
windows = { version = "=0.62.2", features = ["ApplicationModel", "Storage", "Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_WinRT"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
miniz_oxide = "=0.9.1"

[target.'cfg(windows)'.dependencies]
schannel = "=0.1.29"

[build-dependencies]
winres = "0.1"

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }

gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
